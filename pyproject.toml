[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antrl"
version = "0.1.0"
description = "Multi-agent RL for ant-like foraging: independent learners vs. loosened (CTDE) policies in a grid world and a free world"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["antrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
